<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giant Fruit Tree</title>
<style>
  :root{--ink:#1d2a1c;--panel:#fffffff0;color-scheme:light dark}
  @media (prefers-color-scheme: dark){:root{--ink:#e8f3e4;--panel:#142015ee}}
  html,body{margin:0;height:100%;overflow:hidden;background:#9cc8e8;font-family:system-ui,sans-serif}
  canvas{display:block}
  #ui{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top));display:flex;gap:8px;flex-wrap:wrap}
  button{border:0;border-radius:999px;padding:10px 16px;font:600 14px system-ui;background:var(--panel);color:var(--ink);box-shadow:0 2px 10px #0003;cursor:pointer}
  #hint{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));text-align:center;color:#fff;text-shadow:0 1px 4px #000a;font-size:13px;pointer-events:none}
</style>
</head>
<body>
<div id="ui"><button id="regrow">🌱 Grow new tree</button><button id="wind">💨 Wind: on</button></div>
<div id="hint">Drag to orbit · scroll/pinch to zoom · the tiny figure by the trunk is 1.8 m tall</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const T=THREE;
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);
const scene=new T.Scene();
scene.background=new T.Color(0x9cc8e8);scene.fog=new T.Fog(0x9cc8e8,120,420);
const camera=new T.PerspectiveCamera(50,innerWidth/innerHeight,.1,1000);
camera.position.set(70,22,70);
const controls=new T.OrbitControls(camera,renderer.domElement);
controls.target.set(0,22,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.495;controls.minDistance=3;controls.maxDistance=260;

scene.add(new T.HemisphereLight(0xcfe8ff,0x4a5a2a,.75));
const sun=new T.DirectionalLight(0xfff1d6,1.9);
sun.position.set(80,120,50);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-90,right:90,top:90,bottom:-90,near:10,far:320});sun.shadow.bias=-.0004;
scene.add(sun);

/* ---------- helpers ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=4;if(rep){t.wrapS=t.wrapT=T.RepeatWrapping}return t}

const barkTex=canvasTex(512,256,(g,w,h)=>{
  g.fillStyle='#5b4330';g.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){const y=Math.random()*h,x=Math.random()*w,l=30+Math.random()*160,s=Math.random();
    g.strokeStyle=s<.5?`rgba(30,20,12,${.15+Math.random()*.35})`:`rgba(150,120,90,${.08+Math.random()*.18})`;
    g.lineWidth=1+Math.random()*3;g.beginPath();g.moveTo(x,y);g.bezierCurveTo(x+l*.3,y+(Math.random()-.5)*8,x+l*.7,y+(Math.random()-.5)*8,x+l,y+(Math.random()-.5)*5);g.stroke()}
},true);
barkTex.repeat.set(4,3);

const leafTex=canvasTex(128,128,(g,w,h)=>{
  const gr=g.createLinearGradient(0,h,0,0);gr.addColorStop(0,'#2f7a2a');gr.addColorStop(1,'#7ccf4a');
  g.fillStyle=gr;g.beginPath();g.moveTo(w/2,h-4);g.bezierCurveTo(w*1.05,h*.75,w*.95,h*.25,w/2,3);g.bezierCurveTo(w*.05,h*.25,-w*.05,h*.75,w/2,h-4);g.fill();
  g.strokeStyle='#cfeaa0';g.globalAlpha=.7;g.lineWidth=2;g.beginPath();g.moveTo(w/2,h-4);g.lineTo(w/2,10);g.stroke();
  g.lineWidth=1;for(let i=1;i<6;i++){const y=h-i*18;g.beginPath();g.moveTo(w/2,y);g.lineTo(w*.2,y-14);g.moveTo(w/2,y);g.lineTo(w*.8,y-14);g.stroke()}
});

/* ---------- ground ---------- */
const gg=new T.PlaneGeometry(900,900,90,90);gg.rotateX(-Math.PI/2);
{const p=gg.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),d=Math.hypot(x,z);p.setY(i,Math.sin(x*.05)*Math.cos(z*.04)*1.2*Math.min(1,d/40))}gg.computeVertexNormals()}
const grassTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#4f8a34';g.fillRect(0,0,w,h);for(let i=0;i<5000;i++){g.fillStyle=`hsl(${85+Math.random()*30},${45+Math.random()*25}%,${25+Math.random()*22}%)`;g.fillRect(Math.random()*w,Math.random()*h,2,5)}},true);
grassTex.repeat.set(60,60);
const ground=new T.Mesh(gg,new T.MeshStandardMaterial({map:grassTex,roughness:1}));ground.receiveShadow=true;scene.add(ground);

/* ---------- tree ---------- */
const barkMat=new T.MeshStandardMaterial({map:barkTex,roughness:.95,bumpMap:barkTex,bumpScale:2});
const windU={value:0};
let treeGroup=null,windOn=true;

function mergeGeoms(list){
  let vc=0,ic=0;list.forEach(g=>{vc+=g.attributes.position.count;ic+=g.index.count});
  const pos=new Float32Array(vc*3),nor=new Float32Array(vc*3),uv=new Float32Array(vc*2),idx=new Uint32Array(ic);
  let vo=0,io=0;
  list.forEach(g=>{pos.set(g.attributes.position.array,vo*3);nor.set(g.attributes.normal.array,vo*3);uv.set(g.attributes.uv.array,vo*2);
    for(let i=0;i<g.index.count;i++)idx[io+i]=g.index.array[i]+vo;vo+=g.attributes.position.count;io+=g.index.count;g.dispose()});
  const m=new T.BufferGeometry();
  m.setAttribute('position',new T.BufferAttribute(pos,3));m.setAttribute('normal',new T.BufferAttribute(nor,3));m.setAttribute('uv',new T.BufferAttribute(uv,2));m.setIndex(new T.BufferAttribute(idx,1));
  return m;
}

function growTree(seed){
  if(treeGroup){scene.remove(treeGroup);treeGroup.traverse(o=>{if(o.geometry)o.geometry.dispose()})}
  const R=rng(seed),group=new T.Group(),woods=[],leafPts=[],fruitPts=[];
  const rv=s=>new T.Vector3((R()-.5)*s,(R()-.5)*s,(R()-.5)*s);

  function tube(points,r0,r1,radial){
    const curve=new T.CatmullRomCurve3(points),segs=Math.max(4,points.length*3);
    const g=new T.TubeGeometry(curve,segs,1,radial,false),p=g.attributes.position,rs=radial+1;
    for(let i=0;i<=segs;i++){const t=i/segs,c=curve.getPointAt(t),r=r0+(r1-r0)*Math.pow(t,.8);
      for(let j=0;j<rs;j++){const k=i*rs+j,wob=1+Math.sin(j*2.3+i*.9+r0)*.05;
        p.setXYZ(k,c.x+(p.getX(k)-c.x)*r*wob,c.y+(p.getY(k)-c.y)*r*wob,c.z+(p.getZ(k)-c.z)*r*wob)}}
    g.computeVertexNormals();woods.push(g);
  }

  const LEN=[24,16,11,7.5,4.5],RAD=[3.1,1.05,.42,.17,.06];
  function branch(start,dir,depth,rBase){
    const len=LEN[depth]*(.75+R()*.5),segs=depth<2?6:4,pts=[start.clone()],cur=start.clone(),d=dir.clone();
    for(let i=0;i<segs;i++){d.add(rv(depth===0?.16:.5));d.y+=depth<2?.07:(depth>2?-.05:.0);d.normalize();cur.addScaledVector(d,len/segs);pts.push(cur.clone())}
    const r0=rBase,r1=depth===0?rBase*.38:Math.max(.025,rBase*.5);
    tube(pts,r0,r1,depth<2?12:depth<4?6:4);
    if(depth>=3){pts.forEach((p,i)=>{if(i>0)leafPts.push(p,d)});if(R()<.3)fruitPts.push(pts[pts.length-1].clone())}
    if(depth>=4)return;
    const sides=depth===0?9:depth===1?5:depth===2?4:2;
    for(let s=0;s<sides;s++){
      const t=(depth===0?.38:.25)+R()*.7,idx=Math.min(pts.length-1,Math.floor(t*(pts.length-1))+1),p=pts[idx];
      const ang=R()*Math.PI*2,out=new T.Vector3(Math.cos(ang),0,Math.sin(ang)),nd=d.clone().multiplyScalar(.5).add(out.multiplyScalar(depth===0?1.25:.9));
      nd.y+=depth===0?.55:.18;nd.normalize();
      branch(p.clone(),nd,depth+1,Math.max(RAD[depth+1]*(.8+R()*.4),.04)*(depth===0?(1-t*.35):1));
    }
    const kids=depth===0?3:2;
    for(let k=0;k<kids;k++){const nd=d.clone().add(rv(depth===0?1.1:1.0));nd.y+=.25;nd.normalize();branch(pts[pts.length-1].clone(),nd,depth+1,Math.max(RAD[depth+1]*(.85+R()*.3),.04))}
  }

  /* trunk + buttress roots */
  branch(new T.Vector3(0,-1.5,0),new T.Vector3((R()-.5)*.15,1,(R()-.5)*.15),0,RAD[0]);
  for(let i=0;i<7;i++){
    const a=i/7*Math.PI*2+R()*.4,out=new T.Vector3(Math.cos(a),0,Math.sin(a)),pts=[],L=7+R()*7;
    for(let s=0;s<=5;s++){const t=s/5;pts.push(new T.Vector3(out.x*(1.8+t*L),(1-t)*(1-t)*5.5-1.6-t*.4,out.z*(1.8+t*L)).add(rv(.35*t)))}
    tube(pts,1.35+R()*.5,.12,8);
  }
  const wood=new T.Mesh(mergeGeoms(woods),barkMat);wood.castShadow=true;wood.receiveShadow=true;group.add(wood);

  /* leaves (instanced, wind-animated) */
  const maxLeaves=26000,per=Math.max(1,Math.min(6,Math.round(maxLeaves/(leafPts.length/2))));
  const lg=new T.PlaneGeometry(2.1,2.6,1,3);lg.translate(0,1.3,0);
  {const p=lg.attributes.position;for(let i=0;i<p.count;i++)p.setZ(i,Math.pow(p.getY(i)/2.6,2)*-.5)}
  const lm=new T.MeshStandardMaterial({map:leafTex,alphaTest:.5,side:T.DoubleSide,roughness:.7});
  lm.onBeforeCompile=sh=>{sh.uniforms.uTime=windU;
    sh.vertexShader='uniform float uTime;\n'+sh.vertexShader.replace('#include <begin_vertex>',
    `#include <begin_vertex>
     vec3 ip=instanceMatrix[3].xyz;
     float w=sin(uTime*1.6+ip.x*.12+ip.y*.09)*.5+sin(uTime*2.7+ip.z*.2+position.y*2.)*.3;
     transformed.x+=w*.28*(position.y/2.6+.2);transformed.z+=w*.2*(position.y/2.6+.2);`)};
  const leaves=new T.InstancedMesh(lg,lm,maxLeaves),m4=new T.Matrix4(),q=new T.Quaternion(),e=new T.Euler(),col=new T.Color();
  leaves.customDepthMaterial=new T.MeshDepthMaterial({depthPacking:T.RGBADepthPacking,map:leafTex,alphaTest:.5});
  let n=0;
  for(let i=0;i<leafPts.length&&n<maxLeaves;i+=2){
    const p=leafPts[i];
    for(let k=0;k<per&&n<maxLeaves;k++){
      e.set((R()-.5)*2.2-.3,R()*Math.PI*2,(R()-.5)*1.6);q.setFromEuler(e);
      const s=.75+R()*.75;m4.compose(p.clone().add(rv(2.4)),q,new T.Vector3(s,s,s));leaves.setMatrixAt(n,m4);
      col.setHSL(.24+R()*.07,.5+R()*.2,.3+R()*.2);leaves.setColorAt(n,col);n++}
  }
  leaves.count=n;leaves.instanceMatrix.needsUpdate=true;leaves.instanceColor.needsUpdate=true;leaves.castShadow=true;leaves.receiveShadow=true;group.add(leaves);

  /* fruit with stems and a soft sheen */
  const fg=new T.SphereGeometry(.34,18,14);
  {const p=fg.attributes.position;for(let i=0;i<p.count;i++){const y=p.getY(i),x=p.getX(i),z=p.getZ(i),top=Math.max(0,y/.34);
    const pinch=1-top*top*.22;p.setXYZ(i,x*pinch,y*(.95),z*pinch);}fg.computeVertexNormals()}
  const fm=new T.MeshStandardMaterial({roughness:.32,metalness:.05});
  const fruits=new T.InstancedMesh(fg,fm,fruitPts.length),stems=new T.InstancedMesh(new T.CylinderGeometry(.015,.02,.42,5),new T.MeshStandardMaterial({color:0x4a3320}),fruitPts.length);
  const hues=[0,.02,.05,.1,.14];
  fruitPts.forEach((p,i)=>{
    const pos=p.clone().add(new T.Vector3((R()-.5)*.8,-.7-R()*.4,(R()-.5)*.8)),s=.8+R()*.5;
    m4.compose(pos,new T.Quaternion().setFromEuler(new T.Euler((R()-.5)*.3,R()*6,(R()-.5)*.3)),new T.Vector3(s,s,s));fruits.setMatrixAt(i,m4);
    col.setHSL(hues[(R()*hues.length)|0],.8,.46);fruits.setColorAt(i,col);
    m4.compose(pos.clone().add(new T.Vector3(0,.34*s+.12,0)),new T.Quaternion(),new T.Vector3(1,1,1));stems.setMatrixAt(i,m4);
  });
  fruits.castShadow=true;stems.castShadow=false;group.add(fruits,stems);

  scene.add(group);treeGroup=group;
}

/* tiny person for scale */
{const g=new T.Group(),m=c=>new T.MeshStandardMaterial({color:c,roughness:.8});
  const body=new T.Mesh(new T.CylinderGeometry(.2,.24,.9,10),m(0xd9534f));body.position.y=1.0;
  const head=new T.Mesh(new T.SphereGeometry(.15,12,10),m(0xe0ac7e));head.position.y=1.65;
  const legs=new T.Mesh(new T.CylinderGeometry(.2,.17,.7,8),m(0x2f4a7d));legs.position.y=.35;body.position.y=1.15;
  g.add(body,head,legs);g.position.set(4.2,0,3.4);g.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(g)}

growTree(2025);

/* ---------- UI / loop ---------- */
document.getElementById('regrow').onclick=()=>growTree((Math.random()*1e6)|0);
const wb=document.getElementById('wind');wb.onclick=()=>{windOn=!windOn;wb.textContent='💨 Wind: '+(windOn?'on':'off')};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new T.Clock();
(function loop(){requestAnimationFrame(loop);if(windOn)windU.value+=clock.getDelta();else clock.getDelta();controls.update();renderer.render(scene,camera)})();
</script>
</body>
</html>
